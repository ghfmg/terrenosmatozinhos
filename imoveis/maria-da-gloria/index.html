<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Lote no Centro de Matozinhos/MG | Maria da Glória
    </title>

    <meta name="description"
          content="Conheça este lote urbano localizado no Centro de Matozinhos/MG. Área de 311,10 m², com possibilidade de aquisição conjunta do lote vizinho, totalizando 622,75 m².">

    <link rel="stylesheet"
          href="../../assets/css/style.css">

</head>

<body>

    <header class="site-header">

        <div class="container">

            <a href="../../index.html" class="logo">

                <img src="assets/images/logo/logo.svg" alt="Terrenos Matozinhos" width="48" height="48">

                <span class="logo-text">
                    Terrenos Matozinhos
                </span>

            </a>

            <nav class="main-nav" aria-label="Menu principal">

                <ul>

                    <li><a href="#hero">Home</a></li>

                    <li><a href="#imoveis">Imóveis</a></li>

                    <li><a href="#matozinhos">Matozinhos</a></li>

                    <li><a href="#contato">Contato</a></li>

                </ul>

            </nav>

        </div>

    </header>

   <section class="property-gallery">

    <div class="container">

        <h2>Galeria de fotos</h2>

        <p class="section-description">
            Conheça alguns detalhes deste imóvel.
        </p>

        <div class="gallery">

            <figure class="gallery-main">

                <img
                    src="../../assets/images/maria-da-gloria/foto-principal.webp"
                    alt="Vista principal do lote na Rua Maria da Glória">

                <figcaption>
                    Vista principal do imóvel.
                </figcaption>

            </figure>

            <figure>

                <img
                    src="../../assets/images/maria-da-gloria/foto-01.webp"
                    alt="Vista frontal do lote">

                <figcaption>
                    Vista frontal.
                </figcaption>

            </figure>

            <figure>

                <img
                    src="../../assets/images/maria-da-gloria/foto-02.webp"
                    alt="Vista lateral do terreno">

                <figcaption>
                    Vista lateral.
                </figcaption>

            </figure>

            <figure>

                <img
                    src="../../assets/images/maria-da-gloria/foto-03.webp"
                    alt="Entorno do imóvel">

                <figcaption>
                    Entorno.
                </figcaption>

            </figure>

            <figure>

                <img
                    src="../../assets/images/maria-da-gloria/foto-04.webp"
                    alt="Outro ângulo do terreno">

                <figcaption>
                    Outro ângulo do imóvel.
                </figcaption>

            </figure>

        </div>

    </div>

</section>

    <!-- Footer -->

    <script src="../../assets/js/main.js"></script>
